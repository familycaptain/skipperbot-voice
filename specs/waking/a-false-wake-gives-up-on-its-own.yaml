kind: specification
id: voice.waking.a-false-wake-gives-up-on-its-own
title: A false wake costs a tone and a short listen
state: live
autonomy: gated
behavior: >
  When something that was not the wake word is taken for it, the device plays its "speak now"
  tone, opens a conversation and streams the room for a short while; hearing nobody speak, it
  plays its closing tone and goes back to waiting for the wake word. Nobody has to say anything
  to cancel it, and a false wake never leaves the microphone open indefinitely.
implements:
- wake_voice_service.py::run_relay_conversation
- wake_voice_service.py::main
tests: []
links: {}
notes: ''
