kind: specification
id: voice.privacy.the-credential-is-not-in-the-address
title: The credential rides in the request, never in the address
state: live
autonomy: gated
behavior: >
  The credential the device uses to reach the platform is sent in the headers of both its
  ordinary calls and its streaming ones, and never in the address, so it cannot be left behind
  in the platform's access log or a proxy's. A device with no credential configured is refused
  by the platform rather than served anonymously.
implements:
- skipper_voice_client.py::ws_auth_headers
- skipper_voice_client.py::_request
tests: []
links: {}
notes: ''
