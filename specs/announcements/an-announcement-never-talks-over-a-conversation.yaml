kind: specification
id: voice.announcements.an-announcement-never-talks-over-a-conversation
title: An announcement never cuts across somebody mid-conversation
state: live
autonomy: gated
behavior: >
  An announcement that arrives while somebody is mid-conversation with the device is not played:
  it neither interrupts them nor is spoken the moment they stop. A person talking to Skipper is
  never talked over by something they did not ask for.
implements:
- wake_voice_service.py::main
tests: []
links: {}
notes: >
  The device has one speaker; a second thing playing would be fighting the live conversation for
  it.
